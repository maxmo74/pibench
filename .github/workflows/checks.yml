name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Compile Python
        run: python3 -m compileall -q .

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit public tree and CSV
        run: python3 scripts/public_release_audit.py --current-only
